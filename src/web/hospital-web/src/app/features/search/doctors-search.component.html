<div class="page">
  <h2>Search Doctors</h2>

  <form [formGroup]="form" (ngSubmit)="doSearch()" class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g., Rohan">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Specialization Id</mat-label>
      <input matInput type="number" formControlName="specializationId" placeholder="e.g., 1">
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading">Search</button>
  </form>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <table mat-table [dataSource]="results" class="mat-elevation-z1" *ngIf="results?.length">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let r">{{ r.name }}</td>
    </ng-container>

    <ng-container matColumnDef="specializationId">
      <th mat-header-cell *matHeaderCellDef> Specialization </th>
      <td mat-cell *matCellDef="let r">{{ r.specializationId }}</td>
    </ng-container>

    <ng-container matColumnDef="experienceYears">
      <th mat-header-cell *matHeaderCellDef> Exp (yrs) </th>
      <td mat-cell *matCellDef="let r">{{ r.experienceYears }}</td>
    </ng-container>

    <ng-container matColumnDef="contact">
      <th mat-header-cell *matHeaderCellDef> Contact </th>
      <td mat-cell *matCellDef="let r">{{ r.contact }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
