<div class="page">
  <h2>Search Patients</h2>

  <form [formGroup]="form" (ngSubmit)="doSearch()" class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g., Riya">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Condition</mat-label>
      <input matInput formControlName="condition" placeholder="e.g., Diabetes">
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading">Search</button>
  </form>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <table mat-table [dataSource]="results" class="mat-elevation-z1" *ngIf="results?.length">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let r">{{ r.name }}</td>
    </ng-container>

    <ng-container matColumnDef="condition">
      <th mat-header-cell *matHeaderCellDef> Condition </th>
      <td mat-cell *matCellDef="let r">{{ r.condition }}</td>
    </ng-container>

    <ng-container matColumnDef="gender">
      <th mat-header-cell *matHeaderCellDef> Gender </th>
      <td mat-cell *matCellDef="let r">{{ r.gender }}</td>
    </ng-container>

    <ng-container matColumnDef="contact">
      <th mat-header-cell *matHeaderCellDef> Contact </th>
      <td mat-cell *matCellDef="let r">{{ r.contact }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
