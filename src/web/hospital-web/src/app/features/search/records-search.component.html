<div class="page">
  <h2>Search Medical Records</h2>

  <form [formGroup]="form" (ngSubmit)="doSearch()" class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Patient Id</mat-label>
      <input matInput type="number" formControlName="patientId" placeholder="e.g., 7">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Doctor Id</mat-label>
      <input matInput type="number" formControlName="doctorId" placeholder="e.g., 1">
    </mat-form-field>

    <mat-checkbox formControlName="includeArchived">Include Archived</mat-checkbox>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading">Search</button>
  </form>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <table mat-table [dataSource]="results" class="mat-elevation-z1" *ngIf="results?.length">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Record# </th>
      <td mat-cell *matCellDef="let r">{{ r.id }}</td>
    </ng-container>

    <ng-container matColumnDef="patientId">
      <th mat-header-cell *matHeaderCellDef> Patient </th>
      <td mat-cell *matCellDef="let r">{{ r.patientId }}</td>
    </ng-container>

    <ng-container matColumnDef="doctorId">
      <th mat-header-cell *matHeaderCellDef> Doctor </th>
      <td mat-cell *matCellDef="let r">{{ r.doctorId }}</td>
    </ng-container>

    <ng-container matColumnDef="recordType">
      <th mat-header-cell *matHeaderCellDef> Type </th>
      <td mat-cell *matCellDef="let r">{{ r.recordType }}</td>
    </ng-container>

    <ng-container matColumnDef="isArchived">
      <th mat-header-cell *matHeaderCellDef> Archived </th>
      <td mat-cell *matCellDef="let r">{{ r.isArchived ? 'Yes' : 'No' }}</td>
    </ng-container>

    <ng-container matColumnDef="createdOn">
      <th mat-header-cell *matHeaderCellDef> Created </th>
      <td mat-cell *matCellDef="let r">{{ r.createdOn | date:'short' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
