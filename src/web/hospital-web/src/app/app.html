<div class="app-container">
  <nav class="navbar" *ngIf="shouldShowNavbar()">
    <div class="nav-container">
      <div class="nav-brand">
        <mat-icon class="nav-logo">local_hospital</mat-icon>
        <h1 class="nav-title">Hospital Management System</h1>
      </div>
      <div class="nav-menu">
        <a routerLink="/doctors" routerLinkActive="active" class="nav-link">
          <mat-icon>local_hospital</mat-icon>
          <span>Doctors</span>
        </a>
        <a routerLink="/patients" routerLinkActive="active" class="nav-link">
          <mat-icon>group</mat-icon>
          <span>Patients</span>
        </a>
        <a routerLink="/appointments" routerLinkActive="active" class="nav-link">
          <mat-icon>event</mat-icon>
          <span>Appointments</span>
        </a>
        <a routerLink="/records" routerLinkActive="active" class="nav-link">
          <mat-icon>description</mat-icon>
          <span>Medical Records</span>
        </a>
        <a routerLink="/relationships" routerLinkActive="active" class="nav-link">
          <mat-icon>link</mat-icon>
          <span>Relationships</span>
        </a>
        <button mat-raised-button class="logout-btn" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
